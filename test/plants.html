<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Friend Garden plant sheet</title>
<!--
  Every plant at every stage (?mode=stages) or in every mood (?mode=moods&stage=3).
  Add &dusk=1 for the dusk colors, &kinds=fern,tulip for a few kinds, &seed=x for other shapes.
  tools/docs_shots.py uses it for the pictures in docs/the-plants.md.
-->
<link rel="stylesheet" href="../app/fonts/fonts.css">
<style>
  body { margin: 0; font: 15px/1.3 Nunito, system-ui, sans-serif; background: #e8ead2; color: #2b3525; }
  body.dusk { background: #19242a; color: #efe9d8; }
  .grid { display: grid; gap: 0 4px; padding: 18px 20px 22px; align-items: end; }
  .cell { text-align: center; }
  .cell svg { width: 100%; display: block; }
  .head { font: 700 22px/1 Caveat, cursive; text-align: center; padding-bottom: 6px; }
  .row { font: 700 15px/1.2 Nunito, sans-serif; align-self: center; text-align: right; padding-right: 8px; }
</style>
<svg width="0" height="0" style="position:absolute"><defs id="defs"></defs></svg>
<div id="out"></div>
<script type="module">
import { plantSVG, KINDS, WOBBLE_DEFS } from '../app/js/plants.js';
import { STAGE_WORDS, MOOD_WORDS } from '../app/js/logic.js';
document.getElementById('defs').innerHTML = WOBBLE_DEFS;
const q = new URLSearchParams(location.search);
const dusk = q.get('dusk') === '1';
if (dusk) document.body.classList.add('dusk');
const mode = q.get('mode') || 'stages';
const kinds = q.get('kinds') ? KINDS.filter((k) => q.get('kinds').split(',').includes(k.id)) : KINDS;
const seed = q.get('seed') || 'sheet';
const rows = mode === 'stages' ? [0, 1, 2, 3, 4].map((s) => [STAGE_WORDS[s], { stage: s, mood: 'fresh' }])
  : ['fresh', 'thirsty', 'droopy'].map((m) => [MOOD_WORDS[m], { stage: +(q.get('stage') || 3), mood: m }]);
let html = `<div class="grid" style="grid-template-columns:110px repeat(${kinds.length},1fr)"><div></div>`;
for (const k of kinds) html += `<div class="head">${k.name}</div>`;
for (const [label, o] of rows) {
  html += `<div class="row">${label}</div>`;
  for (const k of kinds) html += `<div class="cell">${plantSVG({ kind: k.id, seed: `${seed}-${k.id}`, dusk, crop: true, ...o })}</div>`;
}
document.getElementById('out').innerHTML = html + '</div>';
document.documentElement.dataset.ready = '1';
</script>
