<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Friend Garden</title>
<meta name="description" content="Keep in touch with the people you love: every friend is a plant, and a call is watering it. Free, no account, and it all stays on your device.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#cfe2e6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#24244e" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:title" content="Friend Garden">
<meta property="og:description" content="Keep in touch with the people you love: every friend is a plant, and a call is watering it.">
<meta property="og:url" content="https://stuffs.tiresia.xyz/friend-garden/">
<meta property="og:image" content="https://stuffs.tiresia.xyz/covers/friend-garden.webp">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Friend Garden">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
<script>
  try { var t = localStorage.getItem('friend-garden.theme'); if (t === 'day' || t === 'dusk') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<script type="module" src="js/main.js"></script>
</head>
<body>
<svg class="defs" width="0" height="0" aria-hidden="true" focusable="false"><defs id="defs"></defs></svg>
<div class="sky" aria-hidden="true"></div>
<a class="skip" href="#view">Skip to the garden</a>
<header class="top">
  <a class="brand" href="#/" aria-label="Friend Garden, home">
    <svg class="mark" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
      <ellipse cx="20" cy="33" rx="14" ry="4.5" fill="var(--soil)"/>
      <path d="M20 33V19" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M20 22c0-7-5-11-12-11 0 7 5 11 12 11z" fill="var(--accent)"/>
      <path d="M20 19c0-6 4.5-9.5 10.5-9.5 0 6-4.5 9.5-10.5 9.5z" fill="var(--leaf-2)"/>
      <path d="M31 4.5c1.4 2 2.6 3.6 2.6 5a2.6 2.6 0 0 1-5.2 0c0-1.4 1.2-3 2.6-5z" fill="var(--water)"/>
    </svg>
    <span>Friend Garden</span>
  </a>
  <nav class="tabs" aria-label="Main">
    <a href="#/" data-tab="garden"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21v-8"/><path d="M12 13c0-4-3-6.5-7-6.5 0 4 3 6.5 7 6.5z"/><path d="M12 11c0-3.6 2.6-6 6.6-6 0 3.6-2.6 6-6.6 6z"/><path d="M5 21h14"/></svg><span>Garden</span></a>
    <a href="#/today" data-tab="today"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg><span>Today</span></a>
    <a href="#/add" data-tab="add" class="tab-add"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Add a friend</span></a>
    <a href="#/settings" data-tab="settings"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg><span>Settings</span></a>
  </nav>
</header>
<main id="view" tabindex="-1"></main>
<div class="fireflies" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg" class="sheet"></dialog>
<dialog id="confirm" class="sheet small-sheet"></dialog>
<noscript><p class="noscript">Friend Garden needs JavaScript to grow.</p></noscript>
</body>
</html>
